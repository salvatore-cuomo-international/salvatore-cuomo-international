<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREEN×EXPO 2027 Proposal | ITALYERIA</title>
<style>
:root{--ink:#10281f;--green:#345f4b;--gold:#b58a52;--paper:#f4f0e7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e7eee7,#f7f2e8)}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,#88ad8b55,transparent 35%),radial-gradient(circle at 90% 80%,#d4a85f33,transparent 32%);pointer-events:none}.card{position:relative;width:min(620px,calc(100% - 36px));padding:54px 52px;background:#fffffff0;border:1px solid #ffffff;border-radius:28px;box-shadow:0 28px 80px #17332925}.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--green);font-weight:800}.brand{margin-top:10px;font-family:Georgia,serif;font-size:20px;letter-spacing:.14em}.line{width:44px;height:2px;background:var(--gold);margin:30px 0}h1{margin:0;font-size:clamp(36px,7vw,58px);line-height:1;letter-spacing:-.045em}.ja{margin:16px 0 0;font-size:20px;font-weight:800}.note{margin:30px 0 18px;color:#66736b;line-height:1.65}.field{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid #c9d2cb;border-radius:12px;padding:15px 16px;font-size:16px;background:white}button{border:0;border-radius:12px;padding:15px 24px;background:var(--ink);color:white;font-weight:800;cursor:pointer}.error{height:22px;margin-top:12px;color:#a23c30;font-size:13px}.foot{margin-top:30px;font-size:11px;letter-spacing:.12em;color:#829087}@media(max-width:560px){.card{padding:38px 26px}.field{display:block}.field button{width:100%;margin-top:10px}}
</style></head><body><main class="card"><div class="eyebrow">PRIVATE PROPOSAL</div><div class="brand">ITALYERIA</div><div class="line"></div><h1>GREEN×EXPO 2027</h1><p class="ja">完全無人の販売空間 提案資料</p><p class="note">This proposal is password protected.<br>閲覧用パスワードを入力してください。</p><form id="unlock" class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="submit">OPEN</button></form><div id="error" class="error"></div><div class="foot">SALVATORE CUOMO INTERNATIONAL</div></main>
<script>
const salt='F0GenZRxDHNVbJMVDwQqLw==',iv='FoHjNRBK+GGBAObw',parts=["payload-1.bin","payload-2.bin","payload-3.bin"];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';try{const raw=new TextEncoder().encode(document.getElementById('password').value);const material=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const buffers=await Promise.all(parts.map(async p=>{const r=await fetch(p);if(!r.ok)throw new Error('load');return new Uint8Array(await r.arrayBuffer())}));const size=buffers.reduce((n,b)=>n+b.length,0),payload=new Uint8Array(size);let offset=0;for(const b of buffers){payload.set(b,offset);offset+=b.length}const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(iv)},key,payload);const html=new TextDecoder().decode(clear);document.open();document.write(html);document.close()}catch(_){error.textContent='パスワードが違います。 / Incorrect password.'}});
</script></body></html>
